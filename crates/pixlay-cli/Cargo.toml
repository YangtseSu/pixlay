[package]
name = "pixlay-cli"
description = "Headless render entry point and automation tool (pixlay-render)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pixlay_cli"
path = "src/lib.rs"

[[bin]]
name = "pixlay-render"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pixlay-core = { path = "../pixlay-core" }
pixlay-render = { path = "../pixlay-render" }
# Interim encoding: S6 replaces this with an encoder that writes pixels,
# chroma sampling, ICC and DPI in one pass. Registered in the dependency log.
pixlay-imaging = { path = "../pixlay-imaging" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
pixlay-render = { path = "../pixlay-render" }
serde_json = "1.0"
