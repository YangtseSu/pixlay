[package]
name = "pixlay-imaging"
description = "Decoding, resampling, colour conversion, EXIF, preview copies and encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pixlay-core = { path = "../pixlay-core" }
thiserror = "2.0"
# Decoding backend (`docs/CONTRACT.md` §4.1): the `glycin` facade, which
# on Linux is the sandboxed loader process. It is the only backend measured that
# decodes HEIC and AVIF; `glycin-builtin` covers neither, and its in-process
# frames hang unless they are driven from a glib main context.
glycin = "4.0.0"
# `MainContext::block_on` is behind glib's `futures` feature. The decode is driven
# on a dedicated thread that owns a `MainContext`, because a glycin frame request
# only completes while its main context is being iterated.
glib = { version = "0.22", features = ["futures"] }
gio = "0.22"
# Encoding (S6): one pass per format, writing pixels and metadata together —
# the sRGB profile. The `image` crate's writers leave it at the default (an empty
# one), and Cairo's PNG writer emits no pHYs and no iCCP at all, so the encoder is
# these two crates directly.
png = "0.18.1"
jpeg-encoder = "0.7.1"
