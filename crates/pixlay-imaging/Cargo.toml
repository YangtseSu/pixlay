[package]
name = "pixlay-imaging"
description = "Decoding, resampling, color adjustment, EXIF, color space handling and encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pixlay-core = { path = "../pixlay-core" }
thiserror = "2.0"
# Decoding backend (S4 measurement in docs/STEPS.md): the `glycin` facade, which
# on Linux is the sandboxed loader process. It is the only backend measured that
# decodes HEIC and AVIF; `glycin-builtin` covers neither, and its in-process
# frames hang unless they are driven from a glib main context.
glycin = "4.0.0"
# `MainContext::block_on` is behind glib's `futures` feature. The decode is driven
# on a dedicated thread that owns a `MainContext`, because a glycin frame request
# only completes while its main context is being iterated.
glib = { version = "0.22", features = ["futures"] }
gio = "0.22"
# Encoding (S6): one pass per format, writing pixels and metadata together —
# resolution and the sRGB profile. The `image` crate's writers expose neither
# (`image` leaves them at the defaults), and Cairo's PNG writer emits no pHYs and
# no iCCP at all, so the encoder is these three crates directly.
png = "0.18.1"
jpeg-encoder = "0.7.1"
# LZW only: it is the compression the S0 baseline measured for TIFF, and every
# reader understands it. The other codecs this crate ships are decoders we never
# call.
tiff = { version = "0.11.3", default-features = false, features = ["lzw"] }
