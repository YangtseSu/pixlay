[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
# Policy: track Arch's rolling toolchain instead of supporting old rustc.
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Yangtse Su <yangtsesu@gmail.com>"]
repository = "https://github.com/YangtseSu/pixlay"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

# Baselines are measured in release; the profile is frozen so the numbers stay
# comparable across steps. debug = 1 keeps line info for perf without bloating.
[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

# Dependencies are optimized in dev builds: the imaging pipeline is unusably
# slow otherwise. Workspace members keep the default dev settings.
[profile.dev.package."*"]
opt-level = 2
