# Release: a pushed `vX.Y.Z` tag is built with the project's own build, and its two binaries
# are attached to that tag's GitHub Release as `pixlay-<version>-linux-amd64.tar.gz` beside
# their `.sha256`. amd64 only, and the binaries only: no GitHub runner has an aarch64 Arch
# userland, and the Arch package is built and uploaded on a machine (`AGENTS.md`, "AUR
# discipline").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  amd64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries
        # The three the package depends on, the seccomp meson looks for, and `msgfmt` for the
        # desktop entry and the metainfo.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglycin-2-dev libseccomp-dev \
            meson ninja-build pkg-config gettext
      - name: Build
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
      - name: Check the tag against the tree
        # A tag that disagrees with `meson.build` would publish binaries named for one version
        # and built from another.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tree=$(meson introspect build --projectinfo |
                   python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$tag" != "$tree" ]; then
            echo "tag $GITHUB_REF_NAME does not match meson.build's version $tree" >&2
            exit 1
          fi
      - name: Package the two binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="pixlay-$version-linux-amd64.tar.gz"
          tar -czf "$asset" -C build/crates pixlay pixlay-render
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          cat > /var/tmp/notes.md <<'EOF'
          The two binaries for x86_64 Linux (`pixlay` and `pixlay-render`), built from this tag.
          They link the gtk4, libadwaita and glycin the system provides, so they run on a machine
          that has them; on Arch the `pixlay` package brings all of them.
          EOF
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Pixlay $tag" --notes-file /var/tmp/notes.md --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            pixlay-*-linux-amd64.tar.gz pixlay-*-linux-amd64.tar.gz.sha256
