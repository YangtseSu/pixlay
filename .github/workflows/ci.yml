# CI: the verification entry's fast half. The GUI suite is the machine's
# (`docs/steps/S33-ci-skips-the-gui-suite-done.md`) and the packaging half — the project's
# own build and install — is `packaging.yml`'s, which runs on demand (ruled 2026-09-27,
# human): it costs a release build of the whole workspace, the shell included, and the push
# job was paying that for changes that touch no packaging file. No container: the libraries
# come from the distribution.
#
# What runs here: one clippy pass over every target (the shell included — it is checked,
# never built, because its suite is the machine's), one debug build for the windowless
# crates' tests, and one release build of `pixlay-cli` for the entry's own render command,
# which writes a real 14043 px image. `target/` is cached, so a fresh checkout recompiles
# this workspace's crates rather than their dependencies (the pre-split job's numbers, cold
# against warm, are in S33's record).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Cache the build tree
        # `target/` holds clippy's check artefacts, the tests' debug build and the release
        # build the render runs. The key is `Cargo.lock`, so a source change reuses the tree
        # and a dependency bump does not; `restore-keys` keeps a warmed tree across a bump.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install the libraries
        # Ubuntu splits libheif's decoders into plugins: the HEIC fixture needs libde265
        # and the AVIF one dav1d. No meson, no ninja, no gettext and no data-file
        # validators: those are the packaging workflow's.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglycin-2-dev glycin-loaders bubblewrap \
            libseccomp-dev libheif1 libheif-plugin-libde265 libheif-plugin-dav1d \
            pkg-config
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the windowless crates
        # One selection, one compile. The GUI suite is the only thing left out — it needs
        # a display — and the packaging identity test rides here now, in
        # `crates/pixlay-core/tests/`: run from the shell's crate it made cargo build the
        # GTK stack a second time under a different feature resolution (measured
        # 2026-09-27: 199 s of the run, for a test that reads text files).
        run: cargo test --workspace --exclude pixlay --locked
      - name: Render the verification project
        # Eight photos on `mosaic-8-s14`, at the entry's own long edge, through
        # `pixlay-cli`'s binary — the packaging build used to be what produced it, and this
        # is the release profile the entry names.
        run: |
          cargo build --release -p pixlay-cli --locked
          ./target/release/pixlay-render render \
            --project crates/pixlay-cli/tests/fixtures/verify.pixlay \
            --long-edge 14043 --stats --out /var/tmp/a.jpg
