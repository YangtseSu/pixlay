# CI (S16). **The verification entry `AGENTS.md` names, and nothing else**: the format
# check, the lint, the whole test suite and the entry's own render — on
# `archlinux:latest`, the version policy's decision ("CI / packaging: an
# `archlinux:latest` container, no pinned image tag"), so the rolling toolchain and
# the rolling system libraries are, by construction, the ones this tree is built
# against.
#
# **The package is not built here** (ruled 2026-09-26, human): `makepkg`, the PKGBUILD
# and its `check()` are verified on a machine, where a package can be built *and
# installed*, and what this job answers is "does the program run" — the question a
# container is fit to answer. The tarball-and-makepkg job that stood here is gone with
# that ruling; the PKGBUILD is tested locally.
#
# **The display is mutter, not an Xvfb** (same ruling; `AGENTS.md`'s entry): mutter is
# the compositor this app is developed against and the one whose window behaviour the
# tests measure, and it runs headless with **no GPU node** — measured 2026-09-26 in a
# container-shaped environment with `/dev/dri` hidden: `Created surfaceless renderer
# without GPU`. What it does need is a **session bus** (without one it aborts:
# `set_gnome_env: assertion failed: (session_bus)`) and a machine-id for `dbus-daemon`
# to hang that bus on; the Test step makes both.
#
# `PIXLAY_TEST_CHILD=1` stays the escape hatch for an environment where mutter cannot
# run at all: it tells the harness to use the display the process already has instead of
# starting its own (`tests/support/mod.rs`). A bare Xvfb is **not** that display's equal
# — with no window manager GTK frames the window inside its own surface, so every window
# geometry a GUI test reads comes out 10 px smaller in each direction (measured
# 2026-09-26: 1090x584 against 1100x594).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        # `gettext` is `tests/i18n.rs` (it runs `po/extract-pot`), `libheif` is the
        # HEIC and AVIF fixtures, `mutter` and `dbus` are the display the tests run on
        # and the bus it needs, `mesa` is the software GL that renders with no GPU node.
        run: >-
          pacman -Syu --noconfirm --needed base-devel rust cargo gtk4 libadwaita
          gettext shared-mime-info libheif mutter dbus mesa
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The harness starts its own headless mutter, on a virtual monitor of
        # 1920x1200 (above the app's own 1100x760 default window). The two things it
        # cannot make for itself are here: `dbus-daemon` refuses to start without a
        # machine-id, and mutter puts its Wayland socket in `XDG_RUNTIME_DIR`, which a
        # container does not have at all.
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          install -d -m 700 /var/tmp/pixlay-runtime
          XDG_RUNTIME_DIR=/var/tmp/pixlay-runtime dbus-run-session -- \
            cargo test --workspace
      # The entry's own render, on the repository's own project: eight photos on
      # `mosaic-8-s14`, which exercises decode, resample, the clamp, `draw` and
      # the encoder in one run. `--stats` makes it machine-readable; the image
      # itself is looked at by a person, not by this job.
      - name: Render the verification project
        run: >-
          cargo run --release -p pixlay-cli -- render
          --project crates/pixlay-cli/tests/fixtures/verify.pixlay
          --long-edge 14043 --stats --out /var/tmp/a.jpg