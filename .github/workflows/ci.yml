# CI (S16). **The verification entry `AGENTS.md` names, and nothing else**: the format
# check, the lint, the whole test suite and the entry's own render.
#
# **The runner is `ubuntu-26.04`, named explicitly and with no container** (ruled
# 2026-09-27, human). It used to be an `archlinux:latest` container on `ubuntu-latest`, and
# the GUI suite never went green there: the container's headless mutter mapped the window
# and then never presented a frame — `the widget never produced a render node … waited
# 180.0s, 0 frames arrived` (`crates/pixlay/tests/mainpath.rs`). So the suite runs on the
# runner's own display stack, and the libraries come from the distribution.
#
# The floors `meson.build` declares are below what 26.04 ships (gtk4 ≥ 4.12,
# libadwaita-1 ≥ 1.8 — 26.04 has 1.9.0, and `libglycin-2-dev` is the 2.x package this tree
# links), and the toolchain is the image's own rustup (1.98.1, the workspace's
# `rust-version`).
#
# **The package is not built here** (ruled 2026-09-26, human): `makepkg`, the PKGBUILD and
# its `check()` are verified on a machine, where a package can be built *and installed*,
# and what this job answers is "does the program run".
#
# **The display is mutter, not an Xvfb** (same ruling; `AGENTS.md`'s entry): mutter is the
# compositor this app is developed against and the one whose window behaviour the tests
# measure, and it needs no GPU node. It does need a **session bus** (`dbus-run-session`,
# which the Test step provides) and a machine-id for `dbus-daemon`, which the runner has.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the libraries
        # `libglycin-2-dev` is the decoding backend's 2.x package and `glycin-loaders` the
        # sandboxed loaders the fixtures need — and Ubuntu splits libheif's decoders into
        # plugins, so the HEIC fixture needs `libheif-plugin-libde265` and the AVIF one
        # `libheif-plugin-dav1d` (measured 2026-09-27: without them a GUI test reports
        # "1 photo could not be read" and its export lands nowhere); `gettext` is
        # `tests/i18n.rs` (it runs `po/extract-pot`), `shared-mime-info` the MIME database
        # a packaging test reads, `mutter` and `dbus` the display the tests run on and the
        # bus it needs, and mesa's software rasterizers the GL the runner has no GPU for.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglycin-2-dev glycin-loaders bubblewrap \
            libheif1 libheif-plugin-libde265 libheif-plugin-dav1d \
            libseccomp-dev gettext shared-mime-info meson ninja-build pkg-config \
            adwaita-icon-theme fonts-dejavu-core \
            mutter dbus libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # The harness starts its own headless mutter, on a virtual monitor of 1920x1200
        # (above the app's own 1100x760 default window). What it cannot make for itself is
        # `XDG_RUNTIME_DIR`, where mutter puts its Wayland socket. The GL is the runner's
        # software rasterizer, named rather than discovered: with no GPU node, mesa's Zink
        # cannot choose a device and EGL fails to make a screen, and mutter dies of it
        # (`Mutter terminated with a failure: The command exited with a nonzero status: 139`,
        # measured 2026-09-27). `GTK_A11Y=none` is the runner's missing accessibility bus,
        # which GTK warns about on every window.
        run: |
          install -d -m 700 /var/tmp/pixlay-runtime
          XDG_RUNTIME_DIR=/var/tmp/pixlay-runtime \
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
          GTK_A11Y=none \
            dbus-run-session -- cargo test --workspace
      # The entry's own render, on the repository's own project: eight photos on
      # `mosaic-8-s14`, which exercises decode, resample, the clamp, `draw` and the encoder
      # in one run. `--stats` makes it machine-readable; the image itself is looked at by a
      # person, not by this job.
      - name: Render the verification project
        run: >-
          cargo run --release -p pixlay-cli -- render
          --project crates/pixlay-cli/tests/fixtures/verify.pixlay
          --long-edge 14043 --stats --out /var/tmp/a.jpg
